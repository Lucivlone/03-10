<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
<meta name="googlebot" content="noindex,nofollow,noarchive,nosnippet">
<meta name="theme-color" content="#eee3cf">
<title>03.10</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#eee3cf;color:#655748}body{font-family:Georgia,"Times New Roman",serif}.wrap{min-height:100svh;display:grid;place-items:center;padding:28px;background:radial-gradient(circle at 50% 40%,#f6eddd 0,#eee3cf 46%,#dfcfb7 100%);position:relative;overflow:hidden}.wrap:before{content:"";position:absolute;inset:0;opacity:.15;background-image:radial-gradient(#6d5a45 .45px,transparent .6px);background-size:8px 8px;pointer-events:none}.card{position:relative;z-index:1;width:min(440px,100%);text-align:center;padding:42px 26px}.date{font-family:"Bodoni 72",Didot,"Times New Roman",serif;font-style:italic;font-size:clamp(54px,16vw,86px);font-weight:400;letter-spacing:.01em;color:#947d61;margin:0 0 52px}.sub{font-style:italic;font-size:18px;color:#7b6d5c;margin:0 0 20px}.pin{width:150px;border:0;border-bottom:1px solid rgba(91,73,55,.45);background:transparent;color:#56483a;text-align:center;font-family:"Bodoni 72",Didot,"Times New Roman",serif;font-size:30px;letter-spacing:.22em;padding:8px 8px 9px;outline:none;border-radius:0}.pin::placeholder{color:#b7a994}.btn{margin-top:25px;border:1px solid rgba(91,73,55,.42);background:rgba(255,255,255,.16);color:#655748;padding:11px 23px;border-radius:999px;font:italic 16px Georgia,serif;cursor:pointer}.btn:disabled{opacity:.45;cursor:default}.msg{min-height:22px;margin-top:16px;font:italic 13px Georgia,serif;color:#8b5b59}.progress{width:190px;height:1px;background:rgba(91,73,55,.18);margin:17px auto 0;overflow:hidden;display:none}.bar{height:100%;width:0;background:#8e7a60;transition:width .2s ease}.hint{position:absolute;bottom:max(20px,env(safe-area-inset-bottom));font:italic 12px Georgia,serif;opacity:.58}.shake{animation:shake .28s linear}.loader-fun{display:none;margin:18px auto 0;max-width:240px}.loader-cat{width:140px;height:140px;object-fit:cover;border-radius:18px;display:block;margin:0 auto 10px;box-shadow:0 12px 32px rgba(61,45,27,.16)}.loader-note{font:italic 14px Georgia,serif;color:#7b6d5c}.dots:after{content:"";display:inline-block;animation:dots 1.1s steps(4,end) infinite;width:1.4em;text-align:left;overflow:hidden;vertical-align:bottom}@keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}100%{content:""}}@keyframes shake{25%{transform:translateX(-5px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}
</style>
</head>
<body>
<div class="wrap"><div class="card" id="card"><h1 class="date">03.10</h1><p class="sub">bu sayfa sadece ikimize ait.</p><form id="form"><input id="pin" class="pin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" placeholder="••••" aria-label="Şifre"><br><button class="btn" id="btn" type="submit">aç</button></form><div class="loader-fun" id="loaderFun"><video id="loaderCat" class="loader-cat" src="loader-cat.mp4" autoplay muted loop playsinline></video><div class="loader-note">minik bir bekleyiş daha, sonra anılar orada 🐾</div></div><div class="msg" id="msg"></div><div class="progress" id="progress"><div class="bar" id="bar"></div></div></div><div class="hint">private memory archive</div></div>
<script>
const $=s=>document.querySelector(s), enc=new TextEncoder(), dec=new TextDecoder();
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function derive(password,kdf){
  const base=await crypto.subtle.importKey('raw',enc.encode(password),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(kdf.salt),iterations:kdf.iterations,hash:kdf.hash},base,{name:'AES-GCM',length:256},false,['decrypt']);
}
async function decryptItem(item,key){
  const buf=await fetch(item.file,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('Dosya yüklenemedi');return r.arrayBuffer()});
  return crypto.subtle.decrypt({name:'AES-GCM',iv:b64(item.iv),additionalData:enc.encode(item.path)},key,buf);
}
async function pool(items,limit,worker,onProgress){
  let next=0,done=0; const out=new Array(items.length);
  async function runner(){while(true){const i=next++;if(i>=items.length)return;out[i]=await worker(items[i],i);done++;onProgress(done,items.length)}}
  await Promise.all(Array.from({length:Math.min(limit,items.length)},runner));return out;
}
$('#form').addEventListener('submit',async e=>{
 e.preventDefault(); const pin=$('#pin').value.trim(); if(!pin)return;
 const btn=$('#btn'),msg=$('#msg'),prog=$('#progress'),bar=$('#bar'),card=$('#card'),loaderFun=$('#loaderFun');
 btn.disabled=true; $('#pin').disabled=true; msg.innerHTML='<span class="dots">anılar yükleniyor</span>'; prog.style.display='block'; loaderFun.style.display='block'; bar.style.width='3%';
 try{
   const manifest=await fetch('manifest.json',{cache:'no-store'}).then(r=>r.json());
   const key=await derive(pin,manifest.kdf); bar.style.width='8%';
   let htmlBuf;
   try{htmlBuf=await decryptItem(manifest.main,key)}catch(err){throw new Error('WRONG_PASSWORD')}
   bar.style.width='12%';
   const assetBufs=await pool(manifest.assets,6,(item)=>decryptItem(item,key),(done,total)=>{bar.style.width=(12+Math.round(done/total*84))+'%';msg.textContent=`anılar yükleniyor… ${done}/${total}`});
   const urls={};
   manifest.assets.forEach((item,i)=>{urls[item.path]=URL.createObjectURL(new Blob([assetBufs[i]],{type:item.mime}))});
   let html=dec.decode(htmlBuf);
   Object.entries(urls).sort((a,b)=>b[0].length-a[0].length).forEach(([path,url])=>{html=html.split(path).join(url)});
   bar.style.width='100%';msg.textContent='hazır';
   await new Promise(r=>setTimeout(r,220));
   document.open();document.write(html);document.close();
 }catch(err){
   console.error(err); btn.disabled=false; $('#pin').disabled=false; $('#pin').value=''; $('#pin').focus(); prog.style.display='none'; loaderFun.style.display='none'; bar.style.width='0';
   msg.textContent=err.message==='WRONG_PASSWORD'?'şifre yanlış':'bir şey ters gitti, tekrar dene'; card.classList.remove('shake');void card.offsetWidth;card.classList.add('shake');
 }
});
</script>
</body></html>
